name: Temp Kronos BTC Forecast

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: kronos-btc-run-20261007

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone official Kronos revision
        run: |
          git clone https://github.com/shiyu-coder/Kronos.git Kronos
          cd Kronos
          git checkout 67b630e67f6a18c9e9be918d9b4337c960db1e9a

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Kronos/requirements.txt
          pip install --no-deps git+https://github.com/rongardF/tvdatafeed.git

      - name: Run Kronos BTC forecast
        run: python scripts/kronos_btc_temp.py

      - name: Upload forecast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BTC_Kronos_Forecast_20261007
          path: results/*
          if-no-files-found: error
